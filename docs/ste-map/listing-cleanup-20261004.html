<title>GroomLocal listing cleanup</title>
<style>
/* Layout: a full-window canvas. The top bar holds the paths and tools. The world pans and zooms under it.
   A reader card opens on the right (a bottom sheet on a phone). One visual world, light only. */
:root{
  color-scheme: light;
  --ground:#EAE3D2; --ink:#2B2622; --ink-2:#4e4134; --ink-3:#7d6d5a; --scarlet:#b8402e; --denim:#2c3f5c;
  --paper:#f7f1e3; --rule:rgba(107,74,50,.32);
  --f-display:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --f-hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink)}
body{font-family:var(--f-display);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
code{font-family:var(--f-mono);font-size:.86em;background:rgba(107,74,50,.1);padding:0 .25em;border-radius:3px;overflow-wrap:anywhere}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}

/* ---------- top bar ---------- */
.top{position:relative;z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand . tools" "paths paths paths";align-items:center;gap:8px 22px;padding:10px 16px 8px;background:var(--paper);border-bottom:2px dashed var(--rule);min-width:0}
.brand{grid-area:brand}.tools{grid-area:tools}.paths{grid-area:paths}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand h1{font:800 21px/1.05 var(--f-display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font:500 12px/1.3 var(--f-mono);color:var(--ink-3)}
.paths{display:flex;align-items:center;gap:10px;min-width:0}
.eyebrow{font:700 19px/1 var(--f-hand);color:var(--scarlet);white-space:nowrap}
.path-row{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px;min-width:0}
.ppill{height:34px;--pw:17px;font:700 13px/1 var(--f-display);white-space:nowrap;cursor:pointer;padding:0 4px}
.ppill[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px;border-radius:999px}
.tools{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;min-width:0}
.find{position:relative}
.find input{height:34px;width:190px;border:2px solid var(--rule);border-radius:999px;background:#fffdf7;padding:0 14px;font:500 13px var(--f-display);color:var(--ink)}
.find input:focus{outline:3px solid var(--denim);outline-offset:1px}
.find ul{position:absolute;right:0;top:40px;width:300px;max-height:340px;overflow:auto;margin:0;padding:6px;list-style:none;background:#fffdf7;border:2px solid var(--rule);border-radius:14px;box-shadow:0 14px 30px rgba(45,32,20,.25)}
.find li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:7px 9px;border-radius:9px;cursor:pointer}
.find li button:hover,.find li button:focus-visible{background:rgba(44,63,92,.1)}
.find li b{display:block;font-weight:700;font-size:14px}
.find li span{font:12px var(--f-mono);color:var(--ink-3)}
.tbtn{height:34px;--pw:17px;min-width:34px;font:700 14px/1 var(--f-display);cursor:pointer;padding:0 2px;white-space:nowrap}
.tbtn:focus-visible,.ppill:focus-visible,.step:focus-visible,.zone-tag:focus-visible,.chip:focus-visible,.mpill:focus-visible,.note:focus-visible{outline:3px solid var(--denim);outline-offset:3px}

/* ---------- viewport and world ---------- */
.vp{position:relative;overflow:hidden;touch-action:none;cursor:grab;outline:none;background-color:var(--ground)}
.vp.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.moving{will-change:transform}
.threads{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.th,.th-sh,.lk{fill:none;stroke-linecap:round}
.th{stroke:var(--tc,#b8402e);stroke-width:max(5px, calc(2.4px / var(--k)));stroke-dasharray:18 12;opacity:.9;transition:opacity .25s}
.th-sh{stroke:rgba(45,32,20,.26);stroke-width:max(7px, calc(3.4px / var(--k)));stroke-dasharray:18 12;transform:translate(2px,3px);transition:opacity .25s}
.lk{stroke:var(--denim);stroke-width:max(3px, calc(1.8px / var(--k)));stroke-dasharray:2 10;opacity:.85}
.touring .th,.touring .th-sh{opacity:.1}
.touring .th.on{opacity:1;stroke-width:max(7px, calc(3.4px / var(--k)))}
.touring .th-sh.on{opacity:1}

/* zones */
.zone{position:absolute;border-radius:30px;border:3px dashed rgba(90,64,42,.42);box-shadow:0 22px 44px rgba(45,32,20,.16)}
.zone-head{position:absolute;left:56px;top:40px;display:flex;align-items:flex-start;gap:26px;flex-wrap:wrap}
.zone-tag{cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:2px 6px}
.zone-tag .zt{font:800 34px/1.05 var(--f-display);letter-spacing:-.01em}
.zone-tag .eyebrow{font-size:24px}
.zone-intro{margin:12px 0 0;font:500 19px/1.4 var(--f-display);color:var(--ink-2);max-width:560px}
/* far zoom: the zone name sits in the gap above its zone, like a map label */
.zone-big{position:absolute;left:6px;bottom:calc(100% + 14px);display:none;flex-direction:column;align-items:flex-start;white-space:nowrap;pointer-events:none}
.zone-big b{font:800 clamp(60px, calc(22px / var(--k)), 150px)/.95 var(--f-display);color:#33271d;letter-spacing:-.02em}
.zone-big i{font:700 clamp(40px, calc(15px / var(--k)), 96px)/.9 var(--f-hand);color:var(--scarlet);font-style:normal}
.zone-notes{position:absolute;display:flex;flex-direction:column;gap:26px}

/* steps */
.step{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;border-radius:18px;
  box-shadow:0 6px 9px rgba(45,32,20,.26),0 16px 26px rgba(45,32,20,.2);transition:opacity .25s, box-shadow .2s;overflow:hidden}
.step .num{position:absolute;right:10px;top:8px;font:700 14px/1 var(--f-mono);opacity:.75}
.step .st-title{flex-shrink:0;font:800 max(23px, calc(12.5px / var(--k)))/1.06 var(--f-display);letter-spacing:-.01em;padding-right:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.step .st-sub{font:500 14px/1.25 var(--f-mono);opacity:.88;overflow-wrap:anywhere}
.step .st-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.step.sel{box-shadow:0 0 0 7px rgba(184,64,46,.95),0 6px 9px rgba(45,32,20,.26),0 16px 26px rgba(45,32,20,.2)}
.step.lit{box-shadow:0 0 0 6px rgba(44,63,92,.75),0 6px 9px rgba(45,32,20,.26)}
.touring .step:not(.on){opacity:.42}
.mpill{height:26px;--pw:13px;font:700 11.5px/1 var(--f-mono);white-space:nowrap;padding:0 3px}
button.mpill{cursor:pointer}

/* notes (pinned paper) */
.note{position:relative;display:block;width:100%;text-align:left;cursor:pointer;border:0;padding:26px 24px 22px;background:#fbf5e6;border-radius:6px;
  box-shadow:0 2px 3px rgba(45,32,20,.18),0 14px 24px rgba(45,32,20,.18);transform:rotate(var(--rot,-1deg))}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:20px;height:20px;margin-left:-10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e58a74, #b8402e 55%, #7d2416);box-shadow:0 3px 4px rgba(45,32,20,.4)}
.note .q{display:block;font:700 max(27px, calc(12px / var(--k)))/1.05 var(--f-hand);color:var(--scarlet);margin-bottom:8px}
.note .a{display:block;font:500 16px/1.42 var(--f-display);color:var(--ink)}

/* zoom levels */
[data-z="far"] .zone-head,[data-z="far"] .zone-notes,[data-z="far"] .step > *{visibility:hidden}
[data-z="far"] .zone-big{display:flex}
[data-z="mid"] .step .st-sub,[data-z="mid"] .step .st-pills{display:none}
[data-z="mid"] .note .a,[data-z="mid"] .zone-intro{visibility:hidden}

/* ---------- reader ---------- */
.reader{position:absolute;z-index:20;right:16px;top:16px;bottom:16px;width:min(430px, calc(100% - 32px));display:flex}
.reader-card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(45,32,20,.3)}
.reader-x{position:absolute;right:6px;top:4px;z-index:2;height:30px;--pw:15px;font:700 13px/1 var(--f-display);cursor:pointer}
.reader-body{flex:1;min-height:0;overflow:auto;padding:6px 10px 12px;font-size:15.5px}
.r-tags{display:flex;gap:6px;flex-wrap:wrap;margin:2px 60px 8px 0}
.r-eyebrow{font:700 20px/1 var(--f-hand);color:var(--scarlet);margin:6px 0 2px}
.r-title{font:800 28px/1.08 var(--f-display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.r-sub{font:500 13px/1.35 var(--f-mono);color:var(--ink-3);margin:0 0 6px;overflow-wrap:anywhere}
.r-sec h3{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;padding-bottom:5px;border-bottom:2px dashed var(--rule)}
.r-sec.issues h3{color:var(--scarlet)}
.r-sec.issues .ste-list li::before{background:var(--scarlet)}
.ste{margin:0 0 6px}
.ste:last-child{margin-bottom:0}
.ste-list{margin:0;padding:0;list-style:none}
.ste-list li{position:relative;padding-left:16px;margin:4px 0}
.ste-list li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.r-rows{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:14px 0 0;align-items:start}
.r-rows dt{font:700 11px/26px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.r-rows dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.r-rows dd .ste{margin:0;width:100%}
.files{list-style:none;margin:0;padding:0;font-size:13px}
.files li{margin:4px 0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:30px;--pw:15px;font:700 12.5px/1 var(--f-display);cursor:pointer}
.zlist{list-style:none;margin:0;padding:0;counter-reset:z}
.zlist li{margin:2px 0}
.zlist button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:5px 6px;border-radius:8px;width:100%;box-sizing:border-box}
.zlist button:hover,.zlist button:focus-visible{background:rgba(44,63,92,.1)}
.zlist .n{font:700 12px var(--f-mono);color:var(--ink-3);min-width:22px}
.zlist .d{font:12px var(--f-mono);color:var(--ink-3);margin-left:auto;white-space:nowrap}
.term{all:unset;cursor:pointer;border-bottom:2px dotted var(--denim)}
.term:hover{color:var(--denim)}

/* ---------- tour bar, hint, minimap, drawer ---------- */
.tourbar{position:absolute;z-index:22;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  max-width:min(760px, calc(100% - 32px));padding:12px 18px;background:var(--paper);border:2px dashed var(--rule);border-radius:20px;box-shadow:0 14px 30px rgba(45,32,20,.25)}
.tourbar .tq{font:700 22px/1.1 var(--f-hand);color:var(--scarlet);flex:1 1 260px;min-width:0}
.tourbar .tc{font:600 12.5px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.hint{position:absolute;z-index:15;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 16px;background:rgba(247,241,227,.94);border:2px dashed var(--rule);border-radius:999px;font:600 13px var(--f-display);color:var(--ink-2);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.minimap{position:absolute;z-index:16;left:16px;bottom:16px;width:220px;padding:8px;overflow:hidden;background:rgba(247,241,227,.95);border:2px dashed var(--rule);border-radius:14px;cursor:pointer}
.mm-in{position:relative}
.mm-z{position:absolute;border-radius:3px;opacity:.85}
.mm-view{position:absolute;border:2px solid var(--scarlet);border-radius:3px;pointer-events:none}
.drawer{position:absolute;z-index:25;left:16px;top:16px;bottom:16px;width:min(440px, calc(100% - 32px));display:flex}
.drawer .reader-body h2{font:800 26px/1.1 var(--f-display);margin:4px 60px 6px 0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:8px 0}
.legend .sw{width:46px;height:30px;--bw:10px}
.legend .thsw{width:46px;height:12px}
.dict dt{font:700 13px var(--f-mono);margin-top:10px}
.dict dt span{font-weight:500;color:var(--ink-3)}
.dict dt.not{color:var(--scarlet)}
.dict dd{margin:2px 0 0}
.pop{position:absolute;z-index:40;max-width:320px;background:#fffdf7;border:2px solid var(--rule);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 14px 30px rgba(45,32,20,.28)}
.pop b{font-family:var(--f-mono)}
mark.na{background:none;color:inherit}
.ste-on mark.na{background:#f6d3cc;color:var(--scarlet)}
.ste-on .s::after{content:" " attr(data-wc) "/" attr(data-lim);font:10px var(--f-mono);color:var(--denim);vertical-align:super}
.ste-on .s.over{text-decoration:underline wavy var(--scarlet)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:760px){
  .top{grid-template-columns:minmax(0,1fr);grid-template-areas:"brand" "tools" "paths";gap:6px;padding:8px 12px}
  .brand img{height:22px}.brand h1{font-size:17px}.brand p{display:none}
  .paths .eyebrow{display:none}
  .path-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tools{justify-content:flex-start;flex-wrap:nowrap}
  .find{flex:1 1 auto;min-width:0}.find input{width:100%}
  .find ul{width:min(300px, calc(100vw - 24px));left:0;right:auto}
  .minimap{display:none}
  .reader{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:min(58%, 520px)}
  .drawer{left:8px;right:8px;width:auto}
  .tourbar{top:10px;bottom:auto;padding:8px 12px}
  .tourbar .tq{font-size:18px}
  .hint{white-space:normal;text-align:center;width:calc(100% - 32px)}
}
@media (prefers-reduced-motion: reduce){ .th,.th-sh,.step{transition:none} }
</style>

  }
  function renderProblems() {
    var pr = $("#problems"), bad = CHECK.over.length + CHECK.na.length + CHECK.para.length;
    pr.setAttribute("data-sentences", CHECK.n); pr.setAttribute("data-problems", bad);
    pr.innerHTML = bad ? "<ul>" + CHECK.over.map(function (o) { return "<li>" + esc(o.where) + ": " + o.n + " words (limit " + o.lim + "). " + esc(o.s) + "</li>"; }).join("") +
      CHECK.na.map(function (o) { return "<li>" + esc(o.where) + ": not approved \"" + esc(o.w) + "\".</li>"; }).join("") +
      CHECK.para.map(function (o) { return "<li>" + esc(o.where) + ": " + o.n + " sentences in one paragraph.</li>"; }).join("") + "</ul>" : "";
    var bad2 = [];
    C.steps.forEach(function (s) { refList(s).length; arr(s.reads).concat(arr(s.writes), arr(s.model), arr(s.links)).forEach(function (id) { if (!STEPS[id] && !NOTES[id]) bad2.push(s.id + " -> " + id); }); });
    (C.paths || []).forEach(function (p) { if (!p.steps.length) bad2.push("path " + p.id + " has no steps"); });
    pr.setAttribute("data-broken-refs", bad2.length);
    if (bad2.length) pr.innerHTML += "<ul>" + bad2.map(function (b) { return "<li>broken reference: " + esc(b) + "</li>"; }).join("") + "</ul>";
  }

  /* ---------------- term popover ---------------- */
  function showTerm(btn) {
    var d = TERM[btn.getAttribute("data-term")], pop = $("#pop"); if (!d) return;
    pop.innerHTML = "<b>" + esc(d.term) + "</b>" + (d.pos ? " (" + esc(d.pos) + ")" : "") + steHTML(d.meaning, "desc");
    pop.hidden = false;
    var r = btn.getBoundingClientRect();
    pop.style.left = clamp(r.left, 8, window.innerWidth - pop.offsetWidth - 8) + "px";
    pop.style.top = Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 8) + "px";
  }

  /* ---------------- find ---------------- */
  function findMatches(q) {
    q = q.trim().toLowerCase(); if (!q) return [];
    var out = [];
    C.steps.forEach(function (s) {
      var hay = (s.title + " " + (s.sub || "") + " " + ZONES[s.zone].title + " " + arr(s.what).join(" ")).toLowerCase();
      var score = s.title.toLowerCase().indexOf(q) >= 0 ? 0 : (s.sub || "").toLowerCase().indexOf(q) >= 0 ? 1 : hay.indexOf(q) >= 0 ? 2 : -1;
      if (score >= 0) out.push([score, s]);
    });
    return out.sort(function (a, b) { return a[0] - b[0]; }).slice(0, 10).map(function (x) { return x[1]; });
  }
  function renderFind() {
    var ms = findMatches($("#find-in").value), ul = $("#find-list");
    ul.hidden = !ms.length;
    ul.innerHTML = ms.map(function (s) { return "<li><button type=\"button\" data-go=\"" + esc(s.id) + "\"><b>" + esc(s.title) + "</b><span>" + esc(ZONES[s.zone].title) + " \u00b7 " + esc(s.sub || "") + "</span></button></li>"; }).join("");
  }

  /* ---------------- input ---------------- */
  var ptrs = {}, drag = null, pinch = null;
  function wire() {
    vp.addEventListener("wheel", function (e) {
      if (e.target.closest(".reader,.drawer,.minimap,.tourbar")) return;
      e.preventDefault(); cancelAnimationFrame(anim);
      var r = vp.getBoundingClientRect(), dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1), dx = e.deltaX * (e.deltaMode === 1 ? 16 : 1);
      if (!e.ctrlKey && Math.abs(dx) > Math.abs(dy) * 1.2) { cam.x -= dx; cam.y -= dy; apply(); return; }
      zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * (e.ctrlKey ? 0.012 : 0.0016)));
      $("#hint").style.opacity = 0;
    }, { passive: false });
    vp.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 || e.target.closest(".reader,.drawer,.minimap,.tourbar")) return;
      ptrs[e.pointerId] = [e.clientX, e.clientY];
      var ids = Object.keys(ptrs);
      if (ids.length === 2) {
        var a = ptrs[ids[0]], b = ptrs[ids[1]];
        pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; drag = null;
        try { vp.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      } else drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, id: e.pointerId };
    });
    vp.addEventListener("pointermove", function (e) {
      if (!ptrs[e.pointerId]) return;
      ptrs[e.pointerId] = [e.clientX, e.clientY];
      var ids = Object.keys(ptrs);
      if (pinch && ids.length === 2) {
        var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], r = vp.getBoundingClientRect();
        cam.x += m[0] - pinch.m[0]; cam.y += m[1] - pinch.m[1];
        zoomAt(m[0] - r.left, m[1] - r.top, d / pinch.d); pinch = { d: d, m: m }; return;
      }
      if (!drag) return;
      var ddx = e.clientX - drag.x, ddy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(ddx, ddy) > 5) {
        drag.moved = true; vp.classList.add("dragging"); cancelAnimationFrame(anim);
        try { vp.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        $("#hint").style.opacity = 0;
      }
      if (drag.moved) { cam.x = drag.cx + ddx; cam.y = drag.cy + ddy; apply(); }
    });
    function up(e) {
      delete ptrs[e.pointerId];
      if (Object.keys(ptrs).length < 2) pinch = null;
      if (drag && drag.id === e.pointerId) {
        if (drag.moved) { drag.suppress = true; setTimeout(function () { drag = null; }, 0); } else drag = null;
        vp.classList.remove("dragging");
      }
    }
    vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
    vp.addEventListener("dblclick", function (e) {
      if (e.target.closest(".step,.note,.zone-tag,.reader,.drawer,.minimap,.tourbar")) return;
      var r = vp.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top, k = clamp(cam.k * 2, KMIN, KMAX);
      flyTo({ k: k, x: sx - (sx - cam.x) * (k / cam.k), y: sy - (sy - cam.y) * (k / cam.k) });
    });
    document.addEventListener("click", function (e) {
      if (drag && drag.suppress) return;
      var t;
      if ((t = e.target.closest(".term[data-term]"))) { e.preventDefault(); showTerm(t); return; }
      if (!e.target.closest("#pop")) $("#pop").hidden = true;
      if (!e.target.closest(".find")) $("#find-list").hidden = true;
      if ((t = e.target.closest("[data-tour]"))) { $("#drawer").hidden = true; startTour(t.getAttribute("data-tour"), t.getAttribute("data-at")); return; }
      if ((t = e.target.closest("[data-path]"))) { var pid = t.getAttribute("data-path"); if (tour && tour.id === pid) endTour(); else startTour(pid); return; }
      if ((t = e.target.closest("[data-tnav]"))) { var d = +t.getAttribute("data-tnav"); if (d === 0) endTour(); else tourStep(d); return; }
      if ((t = e.target.closest("[data-go]"))) { $("#find-list").hidden = true; if (e.target.closest("#drawer")) $("#drawer").hidden = true; select(t.getAttribute("data-go")); return; }
      if ((t = e.target.closest(".step"))) { select(t.getAttribute("data-step")); return; }
      if ((t = e.target.closest(".note"))) { focusNote(t.getAttribute("data-note")); return; }
      if ((t = e.target.closest(".zone-tag"))) { focusZone(t.getAttribute("data-zone")); return; }
      if (e.target.closest("#minimap")) {
        var r = $("#mm-in").getBoundingClientRect(), wx = (e.clientX - r.left) / mmK, wy = (e.clientY - r.top) / mmK, s = vpSize();
        flyTo({ k: cam.k, x: s[0] / 2 - wx * cam.k, y: s[1] / 2 - wy * cam.k }); return;
      }
    });
    $("#reader-x").addEventListener("click", closeReader);
    $("#drawer-x").addEventListener("click", function () { $("#drawer").hidden = true; $("#btn-about").setAttribute("aria-expanded", "false"); });
    $("#btn-about").addEventListener("click", function () {
      var d = $("#drawer"), open = d.hidden; d.hidden = !open; this.setAttribute("aria-expanded", String(open));
      if (open) { $("#drawer-body").innerHTML = drawerHTML(); $("#drawer-body").scrollTop = 0; }
    });
    document.addEventListener("click", function (e) {
      if (e.target && e.target.id === "ste-toggle") { var on = !document.documentElement.classList.contains("ste-on"); document.documentElement.classList.toggle("ste-on", on); e.target.textContent = on ? "Hide word counts" : "Show word counts"; }
    });
    $("#btn-fit").addEventListener("click", function () { fitAll(true); });
    $("#btn-in").addEventListener("click", function () { var s = vpSize(); cancelAnimationFrame(anim); var k = clamp(cam.k * 1.6, KMIN, KMAX); flyTo({ k: k, x: s[0] / 2 - (s[0] / 2 - cam.x) * k / cam.k, y: s[1] / 2 - (s[1] / 2 - cam.y) * k / cam.k }); });
    $("#btn-out").addEventListener("click", function () { var s = vpSize(); cancelAnimationFrame(anim); var k = clamp(cam.k / 1.6, KMIN, KMAX); flyTo({ k: k, x: s[0] / 2 - (s[0] / 2 - cam.x) * k / cam.k, y: s[1] / 2 - (s[1] / 2 - cam.y) * k / cam.k }); });
    $("#find-in").addEventListener("input", renderFind);
    $("#find-in").addEventListener("keydown", function (e) { if (e.key === "Enter") { var m = findMatches(this.value); if (m[0]) { $("#find-list").hidden = true; select(m[0].id); } } if (e.key === "Escape") { this.value = ""; renderFind(); } });
    layer.addEventListener("focusin", function (e) {
      var t = e.target.closest(".step");
      if (t && t.matches(":focus-visible") && sel !== t.getAttribute("data-step")) select(t.getAttribute("data-step"));
    });
    document.addEventListener("keydown", function (e) {
      if (e.target.closest && e.target.closest("input")) return;
      var s = vpSize();
      if (e.key === "Escape") { if (!$("#pop").hidden) $("#pop").hidden = true; else if (!$("#drawer").hidden) $("#drawer").hidden = true; else if (!$("#reader").hidden) closeReader(); else if (tour) endTour(); return; }
      if (tour && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !e.target.closest(".step")) { e.preventDefault(); tourStep(e.key === "ArrowRight" ? 1 : -1); return; }
      if (e.target !== vp && e.target !== document.body) return;
      if (e.key === "+" || e.key === "=") zoomAt(s[0] / 2, s[1] / 2, 1.25);
      else if (e.key === "-" || e.key === "_") zoomAt(s[0] / 2, s[1] / 2, 0.8);
      else if (e.key === "0") fitAll(true);
      else if (e.key.indexOf("Arrow") === 0) { e.preventDefault(); var st = 90; if (e.key === "ArrowLeft") cam.x += st; if (e.key === "ArrowRight") cam.x -= st; if (e.key === "ArrowUp") cam.y += st; if (e.key === "ArrowDown") cam.y -= st; apply(); }
    });
    var rt = 0;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { updateMinimap(); groundReset(); }, 120); });
  }

  /* ---------------- start ---------------- */
  build();
  layout();
  wire();
  groundInit();
  renderProblems();
  window.__steCheck = CHECK;
  startView();
  var h0 = (location.hash || "").slice(1);
  if (h0) setTimeout(function () { if (PATHS[h0]) startTour(h0); else select(h0); }, 60);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); if (!h0 && !sel && !tour) startView(); });
})();
</script>
