<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#3DBDB5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E67" />
      <stop offset="100%" stop-color="#E86B55" />
    </linearGradient>
    
    <!-- Drop Shadow for Badge -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="232" height="72" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border for premium feel -->
  <rect x="5" y="5" width="230" height="70" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Accent Circle Container for Paw -->
  <circle cx="44" cy="40" r="24" fill="url(#accentGrad)" />
  <circle cx="44" cy="40" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />

  <!-- Cute Paw Print Icon (White inside coral circle) -->
  <g fill="#FFFFFF" transform="translate(30, 26) scale(0.65)">
    <!-- Main Pad -->
    <path d="M22,38 C14,38 7,33 5,26 C3,19 8,11 16,11 C18,11 20,12 22,13 C24,12 26,11 28,11 C36,11 41,19 39,26 C37,33 30,38 22,38 Z" />
    <!-- Toes (Left to Right) -->
    <ellipse cx="6" cy="14" rx="5" ry="7" transform="rotate(-30 6 14)" />
    <ellipse cx="14" cy="6" rx="5" ry="7" transform="rotate(-15 14 6)" />
    <ellipse cx="30" cy="6" rx="5" ry="7" transform="rotate(15 30 6)" />
    <ellipse cx="38" cy="14" rx="5" ry="7" transform="rotate(30 38 14)" />
  </g>

  <!-- Text: VERIFIED -->
  <text x="82" y="34" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="2" opacity="0.9">VERIFIED ON</text>
  
  <!-- Text: GroomLocal -->
  <text x="81" y="58" font-family="'Fredoka', system-ui, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Groom<tspan fill="#FF7E67">Local</tspan></text>
</svg>
