<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Inter:wght@400;500;600&display=swap');
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #FDF8F0; font-family: 'Inter', system-ui, sans-serif; color: #1E293B; -webkit-font-smoothing: antialiased;">
  <div style="width: 100%; max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    
    <!-- White Paper Card -->
    <div style="background-color: #FFFFFF; border-radius: 24px; padding: 40px; box-shadow: 0 4px 20px rgba(30, 41, 59, 0.06); text-align: center; border: 1px solid #E8DDD4;">
      
      <!-- Maui Mascot Image -->
      <img src="https://groomlocal.com/maui-assets/00-maui-main.png" alt="Maui the Groomer Dog" style="width: 140px; height: auto; margin: 0 auto 24px auto; display: block;" />
      
      <!-- Heading -->
      <h1 style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 28px; line-height: 1.2; font-weight: 600; color: #1E293B; margin: 0 0 16px 0;">Welcome to GroomLocal!</h1>
      
      <!-- Body Text -->
      <p style="font-size: 16px; line-height: 1.6; color: #7C8A97; margin: 0 0 32px 0;">
        We're thrilled to have you here. To get started and explore the best grooming options, please confirm your email address below.
      </p>
      
      <!-- CTA Button -->
      <!-- We use the Next.js SSR token hash URL structure to redirect safely to our app -->
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display: inline-block; background: linear-gradient(135deg, #4ECDC4 0%, #3DBDB5 100%); color: #1E293B; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 18px; text-decoration: none; padding: 14px 32px; border-radius: 9999px; box-shadow: 0 4px 16px rgba(78, 205, 196, 0.3);">
        Confirm Your Email
      </a>
      
      <p style="font-size: 14px; color: #7C8A97; margin: 32px 0 0 0;">
        If you didn't create an account with GroomLocal, you can safely ignore this email.
      </p>

    </div>
    
  </div>
</body>
</html>
